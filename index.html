'use strict';
function $(s){return document.querySelector(s)}
function $$(s){return Array.prototype.slice.call(document.querySelectorAll(s))}
function el(h){var t=document.createElement('template');t.innerHTML=h.trim();return t.content.firstElementChild}
function wait(ms){return new Promise(function(r){setTimeout(r,ms)})}
function rnd(n){return Math.floor(Math.random()*n)}
function pick(a){return a[rnd(a.length)]}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=rnd(i+1);var t=a[i];a[i]=a[j];a[j]=t}return a}
